[package]
name = "lstack"
version = "0.5.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
description = "A lightweight process manager for macOS: scripts, Docker containers and Compose stacks"
license = "MIT"

[[bin]]
name = "lstack"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "process", "io-util", "sync", "macros", "signal"] }
tokio-stream = { version = "0.1", default-features = false }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
ureq = { version = "2", default-features = false, features = ["json"] }
sha2 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = { version = "0.10", default-features = false }
qrcode = { version = "0.14", default-features = false }
chacha20poly1305 = "0.10"
zeroize = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
snow = "0.9"
spake2 = "0.4"
ed25519-dalek = "2"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-util = { version = "0.7", default-features = false, features = ["io-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
