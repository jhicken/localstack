# Builds LStack.app on a macOS runner and publishes the .dmg / .zip / checksums to GitHub Releases.
# Manual only: releases are normally built locally by macos/release.sh. `release.sh --ci` starts this
# instead, or run it from the Actions tab to rebuild an existing tag.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          [[ "$TAG" == "v$VERSION" ]] || { echo "::error::tag $TAG does not match Cargo.toml version $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: |
          cargo test --release --quiet
          (cd tailnet && go test ./...)

      - name: Build app, zip and dmg
        run: macos/build.sh

      - name: Build the Tailscale helper (signed manifest)
        env:
          TAILNET_SIGNING_KEY: ${{ secrets.TAILNET_SIGNING_KEY }}
        run: |
          [[ -n "$TAILNET_SIGNING_KEY" ]] || { echo "::error::the TAILNET_SIGNING_KEY secret is not set"; exit 1; }
          tailnet/build.sh
          echo "TAILNET_VERSION=$(tr -d '[:space:]' < tailnet/VERSION)" >> "$GITHUB_ENV"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 "LStack-$VERSION-arm64.dmg" "LStack-$VERSION-arm64.zip" > "LStack-$VERSION-arm64.sha256"
          cat "LStack-$VERSION-arm64.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=("dist/LStack-$VERSION-arm64.dmg" "dist/LStack-$VERSION-arm64.zip" "dist/LStack-$VERSION-arm64.sha256"
                  "dist/tailnet/lstack-tailnet-$TAILNET_VERSION-darwin-universal.tar.gz"
                  "dist/tailnet/tailnet-manifest.json" "dist/tailnet/tailnet-manifest.sig")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "LStack $VERSION" --generate-notes --verify-tag
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LStack-${{ env.VERSION }}
          path: dist/LStack-*
